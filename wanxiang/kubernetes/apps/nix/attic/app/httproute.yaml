---
# Public ingress terminates on the self-hosted Caddy edge (spec
# 009-caddy-edge-ingress), which reverse-proxies to this cluster over the
# tailnet; its DNS A record is Terraform-managed in terraform/cloudflare-dns.
# Authentication is enforced inside attic via the JWT bearer header
# (require-auth=true in server.toml), so the route is pass-through.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: attic
  annotations:
    # The edge cutover owns nix.beaco.works DNS; keep external-dns from
    # recreating a Cloudflare-proxied record for it.
    external-dns.alpha.kubernetes.io/controller: none
spec:
  hostnames: ["nix.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: attic
          port: 8080
