---
# Release collector profile: a host-mode Forgejo runner that coordinates
# release builds (evaluate, query/seed Attic, publish) and dispatches the
# actual compilation to the Taichu builders. It is the trusted profile and
# holds the write credentials (Attic netrc, registry, prod). Built on the
# shared `forgejo-runner-nix` component; this file only supplies the
# instance-specific secrets/PVC and the per-profile patches.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/forgejo-runner-nix
resources:
  - ./forgejo-runner-init.sops.yaml
  - ./forgejo-runner-attic-netrc.sops.yaml
  - ./forgejo-runner-builder-ssh.sops.yaml
  - ./pvc.yaml
  - ./storageclass.yaml
patches:
  - target:
      kind: HelmRelease
      name: forgejo-runner
    patch: |
      - op: replace
        path: /spec/values/runner/config/file/runner/capacity
        value: 2
      - op: replace
        path: /spec/values/runner/config/file/runner/labels
        value: ["nix-collector:host"]
      - op: replace
        path: /spec/values/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/values/resources/requests/memory
        value: 2Gi
      - op: replace
        path: /spec/values/resources/limits/cpu
        value: "4"
      - op: replace
        path: /spec/values/resources/limits/memory
        value: 12Gi
