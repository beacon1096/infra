---
# Persistent Nix store for the collector. Seeded from the image on first run
# (see the seed-nix-store init container) so eval inputs and build outputs
# survive across releases instead of being re-fetched every time.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-runner-nix
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nix-collector-local
  resources:
    requests:
      storage: 300Gi
