---
apiVersion: v1
kind: Namespace
metadata:
  name: nix-collector
  labels:
    # No privileged runtime here: host-mode runner, no DinD. Keep PSA at
    # `baseline` so a future relaxation cannot silently grant privileges.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
