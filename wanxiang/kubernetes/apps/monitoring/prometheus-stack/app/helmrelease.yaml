---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  install:
    crds: Skip
    remediation:
      retries: 1
  upgrade:
    cleanupOnFail: true
    crds: Skip
    remediation:
      retries: 1
  values:
    # CRDs are already installed by wanxiang/bootstrap/helmfile.d/00-crds.yaml
    # from this same chart version. Keeping Helm away from their lifecycle is
    # the rollback-safe choice for this prepared but not-yet-enabled stack.
    crds:
      enabled: false
    global:
      rbac:
        # The chart gates the operator and Prometheus roles with one global
        # switch. Keep it off and supply the reviewed split roles in rbac.yaml.
        create: false

    defaultRules:
      create: false

    # Only collectors required by this minimal stack are enabled. In
    # particular, kube-state-metrics has no cluster-wide Secret access.
    kube-state-metrics:
      collectors:
        - nodes
        - pods
      rbac:
        create: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    prometheusOperator:
      enabled: true
      admissionWebhooks:
        enabled: false
      # The admission webhook is disabled, so the operator has no reason to
      # mount or serve the chart's admission certificate. Keep probes and the
      # self-monitor on plain HTTP and avoid an unproduced TLS Secret.
      tls:
        enabled: false
      # Keep the operator-managed kubelet Service/Endpoints in the same
      # namespace as its reviewed reconcile Role.
      kubeletService:
        namespace: monitoring
      prometheusInstanceNamespaces:
        - monitoring
      alertmanagerInstanceNamespaces:
        - monitoring
      alertmanagerConfigNamespaces:
        - monitoring
      thanosRulerInstanceNamespaces:
        - monitoring
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

    grafana:
      enabled: true
      replicas: 1
      # Secret contract: monitoring/grafana-oidc must provide these env keys.
      # It is intentionally not created by this repository; Grafana must not
      # start with anonymous access or a fallback identity when it is absent.
      envFromSecret: grafana-oidc
      rbac:
        # The chart's default ClusterRole grants configmaps and secrets in
        # every namespace because both sidecars default to searchNamespace ALL.
        # Use the namespace-local Role in grafana-rbac.yaml instead.
        create: false
      persistence:
        enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      sidecar:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
        dashboards:
          enabled: true
          resource: configmap
          searchNamespace: monitoring
          label: grafana_dashboard
          labelValue: "1"
        datasources:
          enabled: true
          resource: configmap
          searchNamespace: monitoring
          uid: DS_PROMETHEUS
      ingress:
        enabled: false
      grafana.ini:
        server:
          root_url: https://grafana.beaco.works/
          domain: grafana.beaco.works
        users:
          allow_sign_up: false
          auto_assign_org: true
          auto_assign_org_role: Viewer
        auth.anonymous:
          enabled: false
        auth.generic_oauth:
          enabled: true
          name: Authentik
          allow_sign_up: true
          scopes: openid profile email
          auth_url: https://id.beaco.works/application/o/authorize/
          token_url: https://id.beaco.works/application/o/token/
          api_url: https://id.beaco.works/application/o/userinfo/
          use_pkce: true

    # Talos does not expose these control-plane endpoints through Services, and
    # Cilium replaces kube-proxy. Avoid permanently-down synthetic targets.
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: false

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 20m
          memory: 50Mi
        limits:
          cpu: 100m
          memory: 128Mi

    # Keep the kubelet ServiceMonitor beside the operator-managed Service so
    # kubelet synchronization never requires writes in kube-system.
    kubelet:
      namespace: monitoring

    prometheus:
      serviceAccount:
        create: true
      prometheusSpec:
        replicas: 1
        shards: 1
        retention: 7d
        retentionSize: 15GB
        walCompression: true
        enableAdminAPI: false

        # Select the existing monitors and rules throughout the cluster. Empty
        # selectors deliberately mean "all" only because the corresponding
        # NilUsesHelmValues switches are false.
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector: {}
        podMonitorNamespaceSelector: {}
        ruleSelectorNilUsesHelmValues: false
        ruleSelector: {}
        ruleNamespaceSelector: {}

        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              storageClassName: longhorn-r3
              resources:
                requests:
                  storage: 20Gi

    alertmanager:
      enabled: true
      serviceAccount:
        create: true
      # Safe default: evaluate and retain alerts, but send nothing externally.
      # A separately reviewed infra-private AlertmanagerConfig may be selected
      # by the label below after its Secret and destination are approved.
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by:
            - alertname
            - namespace
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          receiver: "null"
        receivers:
          - name: "null"
      alertmanagerSpec:
        replicas: 1
        retention: 120h
        # AlertmanagerConfigs are already restricted to the monitoring
        # namespace and the explicit label below. Disable the default injected
        # namespace alert matcher so the approved route can receive storage,
        # application-namespace, and cluster-scoped alerts.
        alertmanagerConfigMatcherStrategy:
          type: None
        alertmanagerConfigSelector:
          matchLabels:
            observability.beacoworks.xyz/alertmanager: wanxiang
        alertmanagerConfigNamespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              storageClassName: longhorn-r3
              resources:
                requests:
                  storage: 2Gi
