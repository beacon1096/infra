---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-instances
  labels:
    app.kubernetes.io/part-of: wanxiang-observability
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      cnpg.io/podRole: instance
  podTargetLabels:
    - cnpg.io/cluster
    - cnpg.io/instanceName
    - cnpg.io/instanceRole
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-operator
  labels:
    app.kubernetes.io/part-of: wanxiang-observability
spec:
  namespaceSelector:
    matchNames:
      - database
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
