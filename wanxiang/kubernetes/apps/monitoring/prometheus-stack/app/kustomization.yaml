---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./grafana-oidc.sops.yaml
  - ./rbac.yaml
  - ./grafana-rbac.yaml
  - ./grafana-httproute.yaml
  - ./podmonitors.yaml
  - ./prometheusrule.yaml
configMapGenerator:
  - name: wanxiang-platform-overview
    files:
      - wanxiang-platform-overview.json=dashboards/wanxiang-platform-overview.provisioned.json
    options:
      labels:
        grafana_dashboard: "1"
generatorOptions:
  disableNameSuffixHash: true
