---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openstatus-private-location
  labels:
    app.kubernetes.io/name: openstatus-private-location
spec:
  # This is the ingest server, not the active probe. Keep it dormant until the
  # Tinybird Local ingest token is corrected and the probe image is published.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: openstatus-private-location
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openstatus-private-location
    spec:
      containers:
        - name: private-location
          image: ghcr.io/openstatushq/openstatus-private-location@sha256:76b5bc3941bb0b81c35fd70c2615987d278c3bc61e6c743f8646fba6ddc8318a
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: openstatus-config
            - secretRef:
                name: openstatus-secret
          env:
            - name: OPENSTATUS_CONFIG_REVISION
              value: "2026-10-15-private-location-ingest"
            - name: PORT
              value: "8080"
            # The fixed receiver uses TINYBIRD_TOKEN while the Node services
            # use TINY_BIRD_API_KEY for the same Tinybird Local credential.
            - name: TINYBIRD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openstatus-secret
                  key: TINY_BIRD_API_KEY
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: openstatus-private-location
spec:
  selector:
    app.kubernetes.io/name: openstatus-private-location
  ports:
    - name: http
      port: 8080
      targetPort: http
