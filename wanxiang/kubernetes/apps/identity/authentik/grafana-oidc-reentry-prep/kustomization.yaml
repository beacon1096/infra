---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: identity
resources:
  - ../app
configMapGenerator:
  - name: authentik-grafana-oidc-blueprint
    files:
      - grafana-oidc.yaml=blueprints/grafana-oidc.yaml
generatorOptions:
  disableNameSuffixHash: true
patches:
  - path: authentik-helmrelease.patch.yaml
