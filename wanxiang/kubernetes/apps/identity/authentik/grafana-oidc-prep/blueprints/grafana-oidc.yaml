---
version: 1
metadata:
  name: Grafana OIDC
  labels:
    blueprints.goauthentik.io/description: |
      Creates the dedicated Grafana confidential OIDC provider and application.
      Every target must be absent; use the reentry overlay only after the
      Grafana OIDC preflight contract has verified an existing exact object.
context:
  client_id: !Env [AUTHENTIK_GRAFANA_OIDC_CLIENT_ID, null]
  client_secret: !Env [AUTHENTIK_GRAFANA_OIDC_CLIENT_SECRET, null]
entries:
  - id: grafana-viewers
    model: authentik_core.group
    state: must_created
    identifiers:
      name: Grafana Viewers
    attrs:
      is_superuser: false

  - id: grafana-provider
    model: authentik_providers_oauth2.oauth2provider
    state: must_created
    identifiers:
      name: Grafana @ Beacoworks
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Context client_id
      client_secret: !Context client_secret
      access_token_validity: minutes=5
      include_claims_in_id_token: true
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      redirect_uris:
        - matching_mode: strict
          url: https://grafana.beaco.works/login/generic_oauth
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - id: grafana-application
    model: authentik_core.application
    state: must_created
    identifiers:
      slug: grafana
    attrs:
      name: Grafana @ Beacoworks
      slug: grafana
      provider: !KeyOf grafana-provider
      policy_engine_mode: any

  - id: grafana-access-binding
    model: authentik_policies.policybinding
    state: must_created
    identifiers:
      target: !KeyOf grafana-application
      group: !KeyOf grafana-viewers
      order: 0
    attrs:
      enabled: true
      negate: false
