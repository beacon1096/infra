---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-private
spec:
  decryption:
    provider: sops
  deletionPolicy: WaitForTermination
  interval: 1h
  path: ./wanxiang/kubernetes/flux/cluster
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-private
    namespace: flux-system
  wait: false
