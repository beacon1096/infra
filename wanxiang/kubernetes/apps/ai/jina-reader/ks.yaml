apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jina-reader
  namespace: ai
spec:
  interval: 1h
  retryInterval: 1m
  path: ./wanxiang/kubernetes/apps/ai/jina-reader/app
  prune: true
  suspend: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: true
  timeout: 10m
