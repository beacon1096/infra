---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memoh-web
  namespace: ai
  labels:
    app.kubernetes.io/part-of: memoh
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memoh-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memoh-web
        app.kubernetes.io/part-of: memoh
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: docker.io/memohai/web:1.0.2@sha256:65c4087f6a2ef795f26e09b37c713f5dbfbabdbefc790be1332d8640a1db6c0d
          env:
            - name: MEMOH_SERVER_UPSTREAM
              value: memoh-server.ai.svc.cluster.local:8080
            - name: MEMOH_CHANNEL_UPSTREAM
              value: memoh-server.ai.svc.cluster.local:8081
          ports:
            - name: http
              containerPort: 8082
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: memoh-web
  namespace: ai
  labels:
    app.kubernetes.io/part-of: memoh
spec:
  selector:
    app.kubernetes.io/name: memoh-web
  ports:
    - name: http
      port: 8082
      targetPort: http
