apiVersion: batch/v1
kind: Job
metadata:
  name: memoh-migrate-1-0-2
  namespace: ai
  labels:
    app.kubernetes.io/part-of: memoh
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: memoh
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: migrate
          image: docker.io/memohai/server:1.0.2@sha256:84af19aac19ac5eb7d715d88567c44f5911e638d06678966a39f5e68c92c0ccc
          command: [/app/memoh-server, migrate, up]
          volumeMounts:
            - name: config
              mountPath: /app/config.toml
              subPath: config.toml
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          secret:
            secretName: memoh-config
