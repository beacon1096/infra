---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./pg-cluster.yaml
  - ./pg-secret.sops.yaml
  - ./data-pvc.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./secret.sops.yaml
  - ./alertmanager-hook-users.sops.yaml
  - ./alertmanager-hook.yaml
  - ./n8n-ingress-via-gateway.yaml
configMapGenerator:
  - name: n8n-workflows
    files:
      - infra-ci.json=infra-ci.workflow.json
      - renovate-merge-queue.json=renovate-merge-queue.workflow.json
      - alertmanager-matrix.json=alertmanager-matrix.workflow.json
generatorOptions:
  disableNameSuffixHash: true
