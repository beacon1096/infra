---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./pg-cluster.yaml
  - ./pg-secret.sops.yaml
  - ./data-pvc.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./secret.sops.yaml
configMapGenerator:
  - name: n8n-workflows
    files:
      - infra-ci.json=infra-ci.workflow.json
generatorOptions:
  disableNameSuffixHash: true
