---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multica
spec:
  chartRef:
    kind: OCIRepository
    name: multica
  interval: 1h
  values:
    existingSecret: multica-secrets

    images:
      backend:
        repository: forgejo.beaco.works/infrastructure/nix-fleet/multica-backend
        # The chart renders `repository:tag` (no digest field), so pin the
        # immutable infra-private publisher tag (BEACO-219); it maps to digest
        # sha256:7925984b2b55afd7385592cba41c606e592124969c93ff793aea66d8d0849dd6.
        tag: private-2e3ea585612c8568e27e428dde81b5c15c2bad6a-infra-95c14967c35e4e1467191b81d61b439d1b77469c

    postgres:
      external:
        enabled: true

    backend:
      replicas: 1
      uploads:
        persistence:
          enabled: true
          size: 5Gi
          storageClass: longhorn-r3
      config:
        appEnv: production
        appUrl: "https://multica.${SECRET_DOMAIN}"
        frontendOrigin: "https://multica.${SECRET_DOMAIN}"
        corsAllowedOrigins: "https://multica.${SECRET_DOMAIN}"
        cookieDomain: ".${SECRET_DOMAIN}"
        allowSignup: false
        disableWorkspaceCreation: true
        vcsIntegrationEnabled: true
        localUploadBaseUrl: "https://multica.${SECRET_DOMAIN}"
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi

    frontend:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi

    ingress:
      enabled: false

    monitoring:
      prometheusRule:
        enabled: false
