---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./pvc.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./service-tailscale.yaml
  - ./admin.sops.yaml
  - ./authentik.sops.yaml
configMapGenerator:
  - name: forgejo-linear-history
    files:
      - require-linear-history.sh=hooks/require-linear-history.sh
      - infra-baseline=hooks/infra-baseline
generatorOptions:
  disableNameSuffixHash: true
