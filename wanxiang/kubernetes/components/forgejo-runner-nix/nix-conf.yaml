---
# Nix client config shared by all host-mode runner profiles. They perform no
# local builds (max-jobs = 0): evaluation/coordination happen in the runner,
# compilation is dispatched to the Taichu builders over ssh-ng. `netrc-file`
# and the builder SSH key are mounted from per-profile Secrets by the
# HelmRelease.
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-nix-conf
data:
  nix.conf: |
    experimental-features = nix-command flakes
    http2 = false
    builders-use-substitutes = true
    max-jobs = 0
    # No local sandbox builds (max-jobs = 0); the image has no "nixbld" group,
    # so clear the default to avoid a warning on every `nix` invocation.
    build-users-group =
    # Keep the persistent store bounded (GC below 20 GiB free, up to 50 GiB).
    # Nix parses these as bytes, not human sizes.
    min-free = 21474836480
    max-free = 53687091200
    # Machine spec columns: <uri> <system> <ssh-key> <max-jobs> <speed-factor>
    # <supported-features> <mandatory-features> <base64-host-key>. Entries MUST
    # be separated by ";" (or newlines): whitespace-separated entries are parsed
    # as a single machine, which silently drops builders and overruns the
    # base64 host-key column.
    builders = ssh-ng://nixremote@172.16.101.31 x86_64-linux - 1 1 big-parallel,kvm - - ; ssh-ng://nixremote@172.16.101.32 x86_64-linux - 1 1 big-parallel,kvm - - ; ssh-ng://nixremote@172.16.101.33 x86_64-linux - 1 1 big-parallel,kvm - -
    netrc-file = /etc/nix/netrc
    substituters = http://attic.nix.svc.cluster.local:8080/nix-fleet https://cache.nixos.org
    trusted-public-keys = nix-fleet:SFqnNaEmgQD5T6UUi6eWOrjBNe+6oPaDo0/1rH9u1ok= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
