---
# Shared base: a Forgejo Actions runner in HOST mode (no DinD) built on the
# Wrenix forgejo-runner chart and the custom `forgejo-runner-nix` image that
# carries Nix. Instances (profiles) include this component and supply their
# own namespace, secrets (registration, Attic netrc, builder ssh key), and a
# persistent Nix store PVC, then patch the small per-profile differences
# (runner label, capacity, resources).
#
# Why host mode: stock runner images lack Nix, and privileged DinD bypassed
# the nested resource boundary (it once exhausted a control-plane node). See
# docs/infra-ops/nix-collector-build-split.md.
#
# The chart is used purely as packaging:
#   - the `dind` container is removed by postRenderer;
#   - the `runner` container command is replaced so it no longer waits for a
#     Docker daemon at 127.0.0.1:2376;
#   - `DOCKER_*` env is dropped and `privileged` stays false.
#
# Jobs run inside this container and dispatch `nix build` to the Taichu
# builders over ssh-ng (see the `forgejo-runner-nix-conf` ConfigMap). Names
# here are generic so every profile can reuse them in its own namespace.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo-runner
  interval: 1h
  values:
    knownLastVersion: true
    # Deterministic Deployment name for the postRenderer target.
    fullnameOverride: forgejo-runner
    replicaCount: 1
    strategy:
      type: Recreate

    # Published by build-and-push.yaml (skopeo -> Forgejo registry).
    # `latest` + Always so a rebuilt image is actually picked up on restart.
    image:
      registry: forgejo.beaco.works
      repository: infrastructure/nix-fleet/forgejo-runner-nix
      tag: "latest"
      pullPolicy: Always

    # No privileged anywhere: host mode, no DinD.
    securityContext:
      privileged: false

    runner:
      config:
        create: true
        existingInitSecret: "forgejo-runner-init"
        file:
          runner:
            # The chart writes the registration to /data/.runner (emptyDir,
            # copied there by the init container). Pin the absolute path so
            # the daemon does not look for it in the image WORKDIR.
            file: /data/.runner
            capacity: 1
            timeout: 12h
            labels:
              - "forgejo-runner:host"
            envs:
              # ssh-ng to the builders: explicit key and pinned host keys
              # (no TOFU, no runtime ssh-keyscan). The pin is restored across
              # disposable builder rebuilds via the infra-private escrow; see
              # builder-known-hosts.yaml.
              NIX_SSHOPTS: "-i /root/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/etc/nix/builder-known-hosts"
              # In-cluster runners reach Forgejo's SSH via the cluster Service
              # (the public/tailnet hostname is not routable from the cluster).
              # Consumed by the infra-private `setup-infra-ssh` CI action.
              FORGEJO_SSH_HOST: "forgejo-ssh.development.svc.cluster.local"

    # Conservative defaults; profiles with concurrent heavy eval raise the
    # memory limit (the collector uses 12Gi for two concurrent NixOS evals).
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
        ephemeral-storage: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
        ephemeral-storage: 40Gi

  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: forgejo-runner
            patch: |
              # Drop the DinD sidecar.
              - op: remove
                path: /spec/template/spec/containers/1
              # Resolve the edge-served CI hostnames to envoy-internal so
              # in-cluster runners use a valid certificate and stay on the LAN
              # instead of egressing to the public edge (spec
              # 009-caddy-edge-ingress).
              - op: add
                path: /spec/template/spec/hostAliases
                value:
                  - ip: "172.16.87.21"
                    hostnames:
                      - forgejo.beaco.works
                      - nix.beaco.works
              # Run the daemon directly instead of waiting for dockerd. Host
              # keys are pinned via NIX_SSHOPTS, so no startup ssh-keyscan.
              # Create /var/tmp (skopeo uses it for docker-archive temp files)
              # in case a pod runs an image built before it shipped /var/tmp.
              - op: replace
                path: /spec/template/spec/containers/0/command
                value: ["/bin/sh", "-c", "mkdir -p /var/tmp; exec /bin/forgejo-runner --config /etc/runner/config.yaml daemon"]
              # Drop DOCKER_* env (no daemon to talk to).
              - op: remove
                path: /spec/template/spec/containers/0/env
              # Mount nix.conf / attic netrc / builder ssh key / known hosts.
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: nix-conf
                  mountPath: /etc/nix/nix.conf
                  subPath: nix.conf
                  readOnly: true
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: attic-netrc
                  mountPath: /etc/nix/netrc
                  subPath: netrc
                  readOnly: true
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: builder-ssh
                  mountPath: /root/.ssh/id_ed25519
                  subPath: id_ed25519
                  readOnly: true
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: builder-known-hosts
                  mountPath: /etc/nix/builder-known-hosts
                  subPath: known_hosts
                  readOnly: true
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: nix-conf
                  configMap:
                    name: forgejo-runner-nix-conf
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: attic-netrc
                  secret:
                    secretName: forgejo-runner-attic-netrc
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: builder-ssh
                  secret:
                    secretName: forgejo-runner-builder-ssh
                    defaultMode: 0400
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: builder-known-hosts
                  configMap:
                    name: forgejo-runner-known-hosts
              # Persistent, bounded Nix store so eval inputs/outputs survive
              # across runs (emptyDir re-fetched them every release).
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: nix-store
                  mountPath: /nix
              - op: add
                path: /spec/template/spec/initContainers/-
                value:
                  name: seed-nix-store
                  image: forgejo.beaco.works/infrastructure/nix-fleet/forgejo-runner-nix:latest
                  command:
                    - /bin/sh
                    - -c
                    - |
                      version="$(cat /etc/forgejo-runner-nix-version 2>/dev/null || echo unknown)"
                      if [ ! -e /pvc/store ] || [ "$(cat /pvc/.seed-version 2>/dev/null)" != "$version" ]; then
                        echo "seeding /nix from image ($version)"
                        rm -rf /pvc/store /pvc/var /pvc/.seed-version
                        mkdir -p /pvc
                        cp -a /nix/. /pvc/
                        printf '%s' "$version" > /pvc/.seed-version
                      fi
                  volumeMounts:
                    - name: nix-store
                      mountPath: /pvc
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: nix-store
                  persistentVolumeClaim:
                    claimName: forgejo-runner-nix
