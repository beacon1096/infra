access:
  talconfig_source:
    repository: swarm
    path: talos/talconfig.yaml
    kind: declarative_non_secret_source
  talosconfig:
    environment_variable: TALOSCONFIG
    path: /run/coder-infra/talosconfig
    context: kubernetes
  kubeconfig:
    environment_variable: KUBECONFIG
    path: /run/coder-infra/kubeconfig
  sops_age_key:
    environment_variable: SOPS_AGE_KEY_FILE
    path: /run/coder-infra/sops-age-keys
  local_ignored_symlinks:
    - infra/.private/talosconfig
    - infra/.private/kubeconfig
    - infra/.private/sops-age-keys
    - swarm/.private/talosconfig
    - swarm/.private/kubeconfig
    - swarm/.private/sops-age-keys
  secrets_copied_to_repository: false
  sensitive_material_policy:
    - Keep kubeconfig, Talos client config, keys, tokens, and raw device exports out of Git.
    - Store only topology, versions, and other non-secret observations here.

router:
