global:
  scrape_interval: 5s
  scrape_timeout: 4s
scrape_configs:
- job_name: node-exporter
  metrics_path: /metrics/node
  static_configs:
  - targets:
    - 127.0.0.1:42505
    labels:
      namespace: monitoring
      pod: node-exporter-fixture
- job_name: kube-state-metrics
  metrics_path: /metrics/ksm
  static_configs:
  - targets:
    - 127.0.0.1:42505
    labels:
      namespace: monitoring
      pod: ksm-fixture
  honor_labels: true
- job_name: longhorn-backend
  metrics_path: /metrics/longhorn
  static_configs:
  - targets:
    - 127.0.0.1:42505
    labels:
      namespace: storage
      pod: longhorn-manager-fixture
- job_name: monitoring/cnpg-instances
  metrics_path: /metrics/cnpg
