name: NixOS cloud server fleet
slug: nixos-cloud
kind: managed-cloud-servers
observed_at: '2026-08-14'
declaration_only: true
availability_intent: always_on

source:
  repository: nix-fleet
  ref: main
  commit: e381b7f
  flake_targets: flake.nix#nixosConfigurations
  ssh_aliases: hosts/agents/coding/home.nix
  host_config_pattern: hosts/server/<name>/configuration.nix

access:
  ssh:
    user: beacon
    port: 2233
    configured_for_all_listed_hosts: true
    host_key_verification: managed_local_ssh_configuration
    private_key_stored_in_repository: false
    live_reachability_verified: false

servers:
  - name: ark
    address: 107.189.6.180
    system: x86_64-linux
    role: Docker Compose VPS
    hardware: KVM; 40G virtio OS disk (vda); 1T persistent data disk (sda)
    services:
      - Docker
      - qBittorrent
      - aMule
    configuration: hosts/server/ark/configuration.nix

  - name: shuttle
    address: 89.208.241.145
    system: x86_64-linux
    role: edge ingress VPS
    services:
      - Caddy
      - V2Ray
      - Tailscale
    configuration: hosts/server/shuttle/configuration.nix

  - name: courier
    address: 89.208.240.145
    system: x86_64-linux
    role: mail, edge ingress, and exit-node VPS
    services:
      - Caddy
      - V2Ray
      - Stalwart mail
      - Tailscale
    configuration: hosts/server/courier/configuration.nix

  - name: cygnus
    address: 67.230.162.189
    system: x86_64-linux
    role: Docker Compose host and edge-caddy ingress node
    hardware: KVM; 1 vCPU; 526MiB RAM; 10GB sda
    services:
      - Docker
      - Caddy
    configuration: hosts/server/cygnus/configuration.nix

  - name: navi
    address: 89.208.253.236
    system: x86_64-linux
    role: edge ingress and GitHub proxy VPS
    services:
      - Caddy
      - V2Ray
      - Tailscale
    configuration: hosts/server/navi/configuration.nix

  - name: glacier
    address: 1.116.139.81
    system: x86_64-linux
    role: mainland China edge ingress, DERP, and exit-node VPS
    services:
      - Caddy
      - DERP
      - Tailscale
    configuration: hosts/server/glacier/configuration.nix

  - name: speicher
    address: 167.179.83.73
    system: x86_64-linux
    role: edge ingress and exit-node VPS
    services:
      - Caddy
      - V2Ray
      - Tailscale
    configuration: hosts/server/speicher/configuration.nix

  - name: octo
    address: 23.247.139.23
    system: x86_64-linux
    role: Hong Kong edge ingress, DERP, and exit-node VPS
    services:
      - Caddy
      - DERP
      - Tailscale
    configuration: hosts/server/octo/configuration.nix

  - name: flint
    address: 103.118.41.228
    system: x86_64-linux
    provider: HKS (Hong Kong)
    role: production server replacing old flint; hosts remaining Docker services
    hardware: AMD EPYC 7B12; 2 vCPU; 910MB RAM; 30GB vda
    services:
      - Caddy
      - V2Ray
      - Tailscale
      - Docker workloads
    configuration: hosts/server/flint/configuration.nix

always_on_hosts:
  - name: microserver-gen10plus
    address: 100.121.229.9
    address_type: tailscale
    system: x86_64-linux
    role: local home server and remote Nix build host
    hardware: HPE ProLiant MicroServer Gen10 Plus; Intel CC150 (8C/16T); 64GB DDR4 ECC; 3x KIOXIA SATA SSD (RAID5)
    services:
      - Docker
      - Outline
      - Forgejo Actions runner
      - VMware host
    ssh:
      user: beacon
      port: 22
      transport: Tailscale socket proxy
      dedicated_coding_agent_alias: false
    configuration: hosts/personal/fixed/microserver-gen10plus/configuration.nix
    remote_builder_source: modules/common/remote-builder.nix
    access_observation:
      observed_at: '2026-08-14'
      method: SSH over the local Tailscale socket proxy
      result: connected
      remote_hostname: microserver-gen10plus
      remote_user: beacon
      nixos_release: '26.05.20260717.293d6ab (Yarara)'

excluded_from_this_inventory:
  - nixbuilder-01
  - nixbuilder-02
  - nixbuilder-03
  reason: The flake describes these as Harvester NixOS build/runner nodes, not the requested cloud VPS fleet.
