name: Check Docs i18n

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-docs-i18n:
    runs-on: nix-builder
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test docs i18n checks
        run: >-
          nix-shell -I nixpkgs=flake:nixpkgs -p python3
          --run 'python3 utils/test-check-docs-i18n.py'
      - name: Check translated documents changed together
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          if [ -n "$PR_HEAD" ]; then
            head=$PR_HEAD
            base=$(git merge-base "$PR_BASE" "$PR_HEAD")
          else
            head=$(git rev-parse HEAD)
            if [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              base=$PUSH_BEFORE
            else
              base=$(git merge-base "origin/$DEFAULT_BRANCH" "$head")
            fi
          fi
          nix-shell -I nixpkgs=flake:nixpkgs -p python3 \
            --run "python3 utils/check-docs-i18n.py $base $head"
