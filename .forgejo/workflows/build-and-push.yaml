name: Build NixOS Systems and Push Closures

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to build'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
      - migration/**
    tags:
      - '*'

concurrency:
  group: nix-fleet-build-and-push
  cancel-in-progress: true

env:
  ATTIC_ENDPOINT: https://nix.beaco.works
  ATTIC_CACHE: ${{ secrets.ATTIC_CACHE }}
  ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
  REGISTRY_ENDPOINT: ${{ vars.REGISTRY_ENDPOINT || 'https://forgejo.beaco.works' }}
  REGISTRY_USER: ${{ secrets.REPO_TOKEN_OWNER }}
  REGISTRY_TOKEN: ${{ secrets.REPO_TOKEN }}
  # Runner GC can delete derivations referenced only by a persistent eval cache.
  NIX_CONFIG: |
    eval-cache = false
  # Talos-ii currently has no node IPv6 egress. Some fixed-output fetchers
  # resolve AAAA records and curl can fail before IPv4 fallback in CI.
  NIX_CURL_FLAGS: --ipv4

jobs:
  # ── Stage 1: build shared closure and warm Attic cache ────
  warm-cache:
    runs-on: nix-builder
    timeout-minutes: 720
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0

      - name: Record checkout revision
        run: |
          set -euo pipefail
          echo "### checkout" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Requested ref: ${{ inputs.ref || github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Resolved commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Attic
        run: attic login --set-default "$ATTIC_CACHE" "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"

      - name: Build common NixOS closure
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          nix build --print-out-paths --out-link result --keep-going \
            .#common-nixos-closure 2> >(tee nix-build.log >&2) | tee store-path.txt

      - name: Collect failed Nix logs
        if: always()
        run: |
          set +e
          : > nix-failed-drvs.log
          if [ -f nix-build.log ]; then
            grep -E "^error: (Cannot build|builder for) '/nix/store/[^']+\.drv'" nix-build.log \
              | grep -o "/nix/store/[^']*\.drv" | sort -u > failed-drvs.txt || true
            while IFS= read -r drv; do
              [ -n "$drv" ] || continue
              {
                echo "===== $drv ====="
                nix log "$drv"
                echo
              } >> nix-failed-drvs.log 2>&1
            done < failed-drvs.txt
          fi

      - name: Upload Nix logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: nix-logs-warm-cache
          path: |
            nix-build.log
            nix-failed-drvs.log
            failed-drvs.txt

      - name: Seed Attic (best-effort — pushes partial closure on failure)
        if: always()
        run: |
          set +e
          : > attic-seed-paths.txt
          if [ -e result ]; then
            nix path-info -r ./result >> attic-seed-paths.txt 2>/dev/null || true
          fi
          if [ -f nix-build.log ]; then
            grep -Eo '/nix/store/[0-9a-z]{32}[-+._?=A-Za-z0-9]*' nix-build.log \
              | grep -v '\.drv$' >> attic-seed-paths.txt || true
          fi
          sort -u attic-seed-paths.txt -o attic-seed-paths.txt
          wc -l attic-seed-paths.txt
          : > attic-seed-valid-paths.txt
          : > attic-seed-invalid-paths.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if nix path-info "$path" >/dev/null 2>&1; then
              echo "$path" >> attic-seed-valid-paths.txt
            else
              echo "$path" >> attic-seed-invalid-paths.txt
            fi
          done < attic-seed-paths.txt
          wc -l attic-seed-valid-paths.txt attic-seed-invalid-paths.txt
          xargs -r attic push "$ATTIC_CACHE" < attic-seed-valid-paths.txt || true

      - name: Upload Attic seed diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: attic-seed-warm-cache
          path: |
            attic-seed-paths.txt
            attic-seed-valid-paths.txt
            attic-seed-invalid-paths.txt

      - name: Surface build failure (after attic seed)
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::common-nixos-closure build failed (partial closure pushed to attic)"
          exit 1

  warm-cache-arm:
    runs-on: nix-builder-aarch64-darwin
    timeout-minutes: 720
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0

      - name: Configure Attic
        run: attic login --set-default "$ATTIC_CACHE" "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"

      - name: Build common aarch64-darwin closure
        run: |
          set -o pipefail
          nix build --print-out-paths --out-link result-darwin --keep-going \
            .#packages.aarch64-darwin.common-darwin-closure \
            2> >(tee nix-build-darwin.log >&2) | tee store-path-darwin.txt

      - name: Push common aarch64-darwin closure to Attic
        run: attic push "$ATTIC_CACHE" ./result-darwin

      - name: Build common aarch64-linux closure
        run: |
          set -o pipefail
          nix build --print-out-paths --out-link result-linux --keep-going \
            .#packages.aarch64-linux.common-nixos-closure \
            2> >(tee nix-build-linux.log >&2) | tee store-path-linux.txt

      - name: Push common aarch64-linux closure to Attic
        run: attic push "$ATTIC_CACHE" ./result-linux

  # ── Stage 2: system builds (parallel, cache-warm) ─────────
  build-systems:
    needs: warm-cache
    runs-on: nix-builder
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: m920x
            flake-attr: nixosConfigurations.m920x.config.system.build.toplevel
          - target: msi-claw
            flake-attr: nixosConfigurations.msi-claw.config.system.build.toplevel
          - target: thinkbook-plus-hybrid
            flake-attr: nixosConfigurations.thinkbook-plus-hybrid.config.system.build.toplevel
          - target: surface-pro-8
            flake-attr: nixosConfigurations.surface-pro-8.config.system.build.toplevel
          - target: microserver-gen10plus
            flake-attr: nixosConfigurations.microserver-gen10plus.config.system.build.toplevel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0

      - name: Record checkout revision
        run: |
          set -euo pipefail
          echo "### checkout" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Requested ref: ${{ inputs.ref || github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Resolved commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Attic
        run: attic login --set-default "$ATTIC_CACHE" "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"

      - name: Build ${{ matrix.target }}
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          nix build --print-out-paths --out-link result --keep-going \
            .#${{ matrix.flake-attr }} 2> >(tee nix-build.log >&2) | tee store-path.txt

      - name: Collect failed Nix logs
        if: always()
        run: |
          set +e
          : > nix-failed-drvs.log
          if [ -f nix-build.log ]; then
            grep -E "^error: (Cannot build|builder for) '/nix/store/[^']+\.drv'" nix-build.log \
              | grep -o "/nix/store/[^']*\.drv" | sort -u > failed-drvs.txt || true
            while IFS= read -r drv; do
              [ -n "$drv" ] || continue
              {
                echo "===== $drv ====="
                nix log "$drv"
                echo
              } >> nix-failed-drvs.log 2>&1
            done < failed-drvs.txt
          fi

      - name: Upload Nix logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: nix-logs-${{ matrix.target }}
          path: |
            nix-build.log
            nix-failed-drvs.log
            failed-drvs.txt

      - name: Seed Attic (best-effort — partial closure on failure)
        if: always()
        run: |
          set +e
          : > attic-seed-paths.txt
          if [ -e result ]; then
            nix path-info -r ./result >> attic-seed-paths.txt 2>/dev/null || true
          fi
          if [ -f nix-build.log ]; then
            grep -Eo '/nix/store/[0-9a-z]{32}[-+._?=A-Za-z0-9]*' nix-build.log \
              | grep -v '\.drv$' >> attic-seed-paths.txt || true
          fi
          sort -u attic-seed-paths.txt -o attic-seed-paths.txt
          wc -l attic-seed-paths.txt
          : > attic-seed-valid-paths.txt
          : > attic-seed-invalid-paths.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if nix path-info "$path" >/dev/null 2>&1; then
              echo "$path" >> attic-seed-valid-paths.txt
            else
              echo "$path" >> attic-seed-invalid-paths.txt
            fi
          done < attic-seed-paths.txt
          wc -l attic-seed-valid-paths.txt attic-seed-invalid-paths.txt
          xargs -r attic push "$ATTIC_CACHE" < attic-seed-valid-paths.txt || true

      - name: Upload Attic seed diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: attic-seed-${{ matrix.target }}
          path: |
            attic-seed-paths.txt
            attic-seed-valid-paths.txt
            attic-seed-invalid-paths.txt

      - name: Summary
        if: always()
        run: |
          echo "### ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -s store-path.txt ]; then
            echo "Store path: \`$(cat store-path.txt)\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Build failed — partial closure pushed to attic." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Surface build failure (after attic seed)
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::${{ matrix.target }} build failed (partial closure pushed to attic)"
          exit 1

  build-arm-systems:
    needs: warm-cache-arm
    runs-on: nix-builder-aarch64-darwin
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ms-r1
            flake-attr: nixosConfigurations.ms-r1.config.system.build.toplevel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0

      - name: Record checkout revision
        run: |
          set -euo pipefail
          echo "### checkout" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Requested ref: ${{ inputs.ref || github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Resolved commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Attic
        run: attic login --set-default "$ATTIC_CACHE" "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"

      - name: Build ${{ matrix.target }}
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          nix build --print-out-paths --out-link result --keep-going \
            .#${{ matrix.flake-attr }} 2> >(tee nix-build.log >&2) | tee store-path.txt

      - name: Collect failed Nix logs
        if: always()
        run: |
          set +e
          : > nix-failed-drvs.log
          if [ -f nix-build.log ]; then
            grep -E "^error: (Cannot build|builder for) '/nix/store/[^']+\.drv'" nix-build.log \
              | grep -o "/nix/store/[^']*\.drv" | sort -u > failed-drvs.txt || true
            while IFS= read -r drv; do
              [ -n "$drv" ] || continue
              {
                echo "===== $drv ====="
                nix log "$drv"
                echo
              } >> nix-failed-drvs.log 2>&1
            done < failed-drvs.txt
          fi

      - name: Upload Nix logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: nix-logs-${{ matrix.target }}
          path: |
            nix-build.log
            nix-failed-drvs.log
            failed-drvs.txt

      - name: Seed Attic (best-effort — partial closure on failure)
        if: always()
        run: |
          set +e
          : > attic-seed-paths.txt
          if [ -e result ]; then
