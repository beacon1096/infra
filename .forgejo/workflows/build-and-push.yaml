            failed-drvs.txt

      - name: Seed Attic (best-effort — partial closure on failure)
        if: always()
        run: |
          set +e
          : > attic-seed-paths.txt
          if [ -e result ]; then
            nix path-info -r ./result >> attic-seed-paths.txt 2>/dev/null || true
          fi
          if [ -f nix-build.log ]; then
            grep -Eo '/nix/store/[0-9a-z]{32}[-+._?=A-Za-z0-9]*' nix-build.log \
              | grep -v '\.drv$' >> attic-seed-paths.txt || true
          fi
          sort -u attic-seed-paths.txt -o attic-seed-paths.txt
          wc -l attic-seed-paths.txt
          : > attic-seed-valid-paths.txt
          : > attic-seed-invalid-paths.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if nix path-info "$path" >/dev/null 2>&1; then
              echo "$path" >> attic-seed-valid-paths.txt
            else
              echo "$path" >> attic-seed-invalid-paths.txt
            fi
          done < attic-seed-paths.txt
          wc -l attic-seed-valid-paths.txt attic-seed-invalid-paths.txt
          xargs -r attic push "$ATTIC_CACHE" < attic-seed-valid-paths.txt || true

      - name: Upload Attic seed diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: attic-seed-coding-agent-oci
          path: |
            attic-seed-paths.txt
            attic-seed-valid-paths.txt
            attic-seed-invalid-paths.txt

      - name: Surface build failure (after attic seed)
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::coding-agent-oci build failed (partial closure pushed to attic)"
          exit 1

      - name: Setup containers policy
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/containers"
          echo '{"default": [{"type": "insecureAcceptAnything"}]}' > "$HOME/.config/containers/policy.json"

      - name: Push to Forgejo Registry
        env:
          IMAGE_PATH: infrastructure/nix-fleet/coding-agent
        run: |
          set -euo pipefail
          test -n "$REGISTRY_ENDPOINT" || {
            echo "REGISTRY_ENDPOINT action variable is required" >&2
            exit 1
          }
          test -n "$REGISTRY_USER"
          test -n "$REGISTRY_TOKEN"

          registry_host="${REGISTRY_ENDPOINT#http://}"
          registry_host="${registry_host#https://}"
          skopeo_args=(--retry-times 5 --retry-delay 10s)
          auth_file="$PWD/.skopeo-auth.json"
          trap 'rm -f "$auth_file"' EXIT
          mkdir -p "$PWD/.skopeo-tmp"

          printf '%s' "$REGISTRY_TOKEN" | nix shell nixpkgs#skopeo -c \
            skopeo login --authfile "$auth_file" --username "$REGISTRY_USER" \
            --password-stdin "$registry_host"

          if [[ "$registry_host" == *"svc.cluster.local"* ]]; then
            skopeo_args+=(--dest-tls-verify=false)
          fi

          nix shell nixpkgs#skopeo -c skopeo --authfile "$auth_file" --tmpdir "$PWD/.skopeo-tmp" copy \
            "${skopeo_args[@]}" \
            docker-archive:result \
            docker://$registry_host/$IMAGE_PATH:latest

          if [[ $GITHUB_REF == refs/tags/* ]]; then
            tag=${GITHUB_REF#refs/tags/}
            nix shell nixpkgs#skopeo -c skopeo --authfile "$auth_file" --tmpdir "$PWD/.skopeo-tmp" copy \
              "${skopeo_args[@]}" \
              docker-archive:result \
              docker://$registry_host/$IMAGE_PATH:$tag
          fi

      - name: Summary
        run: |
          echo "### coding-agent-oci" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Store path: \`$(cat store-path.txt)\`" >> "$GITHUB_STEP_SUMMARY"

  build-and-push-multica-backend-oci:
    needs: warm-cache
    runs-on: nix-builder
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0

      - name: Configure Attic
        run: attic login --set-default "$ATTIC_CACHE" "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"

      - name: Build patched Multica backend
        run: |
          set -euo pipefail
          nix build --print-out-paths --out-link result-multica \
            .#multica-backend-oci | tee multica-store-path.txt
          attic push "$ATTIC_CACHE" "$(cat multica-store-path.txt)"

      - name: Push to Forgejo Registry
        env:
          IMAGE_PATH: infrastructure/nix-fleet/multica-backend
          IMAGE_TAG: 0.4.24-beacon.1
        run: |
          set -euo pipefail
          registry_host="${REGISTRY_ENDPOINT#http://}"
          registry_host="${registry_host#https://}"
          test -n "$REGISTRY_USER"
          test -n "$REGISTRY_TOKEN"
          auth_file="$PWD/.skopeo-auth.json"
          trap 'rm -f "$auth_file"' EXIT
          mkdir -p "$PWD/.skopeo-tmp"
          printf '%s' "$REGISTRY_TOKEN" | nix shell nixpkgs#skopeo -c \
            skopeo login --authfile "$auth_file" --username "$REGISTRY_USER" \
            --password-stdin "$registry_host"
          nix shell nixpkgs#skopeo -c skopeo --authfile "$auth_file" --tmpdir "$PWD/.skopeo-tmp" copy \
            --retry-times 5 --retry-delay 10s \
            docker-archive:result-multica \
            "docker://$registry_host/$IMAGE_PATH:$IMAGE_TAG"

      - name: Summary
        run: |
          echo "### multica-backend-oci" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`forgejo.beaco.works/infrastructure/nix-fleet/multica-backend:0.4.24-beacon.1\`" >> "$GITHUB_STEP_SUMMARY"

  update-prod-branch:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-systems
      - build-arm-systems
      - build-darwin-systems
      - build-installer-iso
      - build-and-push-coding-agent-oci
      - build-and-push-multica-backend-oci
    runs-on: nix-builder
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update prod branch to released tag
        run: |
          set -euo pipefail
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions@localhost"
          git push origin "$GITHUB_SHA:refs/heads/prod"

      - name: Summary
        run: |
          echo "### prod" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Updated \`prod\` to \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA}\`." >> "$GITHUB_STEP_SUMMARY"
