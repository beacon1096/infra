            grep -Eo '/nix/store/[0-9a-z]{32}[-+._?=A-Za-z0-9]*' nix-build.log \
              | grep -v '\.drv$' >> attic-seed-paths.txt || true
          fi
          sort -u attic-seed-paths.txt -o attic-seed-paths.txt
          : > attic-seed-valid-paths.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            nix path-info "$path" >/dev/null 2>&1 && echo "$path" >> attic-seed-valid-paths.txt
          done < attic-seed-paths.txt
          xargs -r attic push "$ATTIC_CACHE" < attic-seed-valid-paths.txt || true

      - name: Surface build failure (after attic seed)
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::${{ matrix.target }} build failed (partial closure pushed to attic)"
          exit 1

  build-darwin-systems:
    needs: warm-cache-arm
    runs-on: nix-builder-aarch64-darwin
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: beacon-mac-mini-m4
            flake-attr: darwinConfigurations.beacon-mac-mini-m4.system
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0

      - name: Configure Attic
        run: attic login --set-default "$ATTIC_CACHE" "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"

      - name: Build ${{ matrix.target }}
        run: |
          set -o pipefail
          nix build --print-out-paths --out-link result --keep-going \
            .#${{ matrix.flake-attr }} 2> >(tee nix-build.log >&2) | tee store-path.txt

      - name: Push system closure to Attic
        run: attic push "$ATTIC_CACHE" ./result

  build-installer-iso:
    needs: warm-cache
    runs-on: nix-builder
    timeout-minutes: 720
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0

      - name: Record checkout revision
        run: |
          set -euo pipefail
          echo "### checkout" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Requested ref: ${{ inputs.ref || github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Resolved commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Attic
        run: attic login --set-default "$ATTIC_CACHE" "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"

      - name: Build installer ISO
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          nix build --print-out-paths --out-link result --keep-going \
            .#packages.x86_64-linux.installer-iso 2> >(tee nix-build.log >&2) | tee store-path.txt

      - name: Collect failed Nix logs
        if: always()
        run: |
          set +e
          : > nix-failed-drvs.log
          if [ -f nix-build.log ]; then
            grep -E "^error: (Cannot build|builder for) '/nix/store/[^']+\.drv'" nix-build.log \
              | grep -o "/nix/store/[^']*\.drv" | sort -u > failed-drvs.txt || true
            while IFS= read -r drv; do
              [ -n "$drv" ] || continue
              {
                echo "===== $drv ====="
                nix log "$drv"
                echo
              } >> nix-failed-drvs.log 2>&1
            done < failed-drvs.txt
          fi

      - name: Upload Nix logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: nix-logs-installer-iso
          path: |
            nix-build.log
            nix-failed-drvs.log
            failed-drvs.txt

      - name: Seed Attic (best-effort — partial closure on failure)
        if: always()
        run: |
          set +e
          : > attic-seed-paths.txt
          if [ -e result ]; then
            nix path-info -r ./result >> attic-seed-paths.txt 2>/dev/null || true
          fi
          if [ -f nix-build.log ]; then
            grep -Eo '/nix/store/[0-9a-z]{32}[-+._?=A-Za-z0-9]*' nix-build.log \
              | grep -v '\.drv$' >> attic-seed-paths.txt || true
          fi
          sort -u attic-seed-paths.txt -o attic-seed-paths.txt
          wc -l attic-seed-paths.txt
          : > attic-seed-valid-paths.txt
          : > attic-seed-invalid-paths.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if nix path-info "$path" >/dev/null 2>&1; then
              echo "$path" >> attic-seed-valid-paths.txt
            else
              echo "$path" >> attic-seed-invalid-paths.txt
            fi
          done < attic-seed-paths.txt
          wc -l attic-seed-valid-paths.txt attic-seed-invalid-paths.txt
          xargs -r attic push "$ATTIC_CACHE" < attic-seed-valid-paths.txt || true

      - name: Installer build failure (after attic seed)
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::installer-iso build failed (partial closure pushed to attic)"
          exit 1

      - name: Upload Attic seed diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: attic-seed-installer-iso
          path: |
            attic-seed-paths.txt
            attic-seed-valid-paths.txt
            attic-seed-invalid-paths.txt

      - name: Upload ISO to Forgejo Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          export PATH="$(nix build nixpkgs#jq --print-out-paths --no-link --keep-going)/bin:$PATH"

          tag="${GITHUB_REF_NAME}"
          server_url="${GITHUB_SERVER_URL}"
          repo="${GITHUB_REPOSITORY}"
          api_url="${server_url}/api/v1/repos/${repo}"

          # Create release if it doesn't exist
          release_id=$(curl -sf \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            "${api_url}/releases/tags/${tag}" | jq -r '.id // empty') || true

          if [ -z "$release_id" ]; then
            release_id=$(curl -sf \
              -X POST \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\": \"${tag}\", \"name\": \"${tag}\"}" \
              "${api_url}/releases" | jq -r '.id')
          fi

          # Upload ISO files as release assets
          for iso in result/iso/*.iso; do
            filename=$(basename "$iso")
            echo "Uploading ${filename}..."
            curl -sf \
              -X POST \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${iso}" \
              "${api_url}/releases/${release_id}/assets?name=${filename}"
            echo "Uploaded ${filename}"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}

      - name: Summary
        run: |
          echo "### installer-iso" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Store path: \`$(cat store-path.txt)\`" >> "$GITHUB_STEP_SUMMARY"

  # ── OCI image publish (Forgejo registry) ─────────────────
  #
  # Publish self-built images to the Forgejo registry from an in-cluster
  # builder. Large workstation uploads through the public edge may time out.
  build-and-push-coding-agent-oci:
    needs: warm-cache
    runs-on: nix-builder
    timeout-minutes: 720
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0

      - name: Record checkout revision
        run: |
          set -euo pipefail
          echo "### checkout" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Requested ref: ${{ inputs.ref || github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Resolved commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Attic
        run: attic login --set-default "$ATTIC_CACHE" "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"

      - name: Build OCI image
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          nix build --print-out-paths --out-link result --keep-going \
            .#coding-agent-oci 2> >(tee nix-build.log >&2) | tee store-path.txt

      - name: Collect failed Nix logs
        if: always()
        run: |
