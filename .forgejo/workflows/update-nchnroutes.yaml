name: Update nchnroutes data

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 0'

permissions:
  contents: write

concurrency:
  group: update-nchnroutes

jobs:
  update-nchnroutes:
    runs-on: nix-collector
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update locked inputs
        run: nix flake update nchnroutes-src china-ip-list

      - name: Update APNIC snapshot
        run: |
          set -euo pipefail
          snapshot=$(mktemp)
          trap 'rm -f "$snapshot"' EXIT
          curl -4 -fsSL --retry 5 --retry-all-errors \
            https://ftp.apnic.net/stats/apnic/delegated-apnic-latest \
            -o "$snapshot"
          date=$(awk -F'|' '$1 == "2" && $2 == "apnic" { print $3; exit }' "$snapshot")
          [[ "$date" =~ ^[0-9]{8}$ ]]
          hash=$(nix hash file --sri "$snapshot")
          sed -i -E \
            -e 's|apnicSnapshotDate = "[0-9]{8}";|apnicSnapshotDate = "'"$date"'";|' \
            -e 's|apnicSnapshotHash = "sha256-[^"]+";|apnicSnapshotHash = "'"$hash"'";|' \
            packages/nchnroutes/default.nix

      - name: Build and validate routes
        run: |
          set -euo pipefail
          nix build --print-out-paths --out-link result --keep-going \
            .#packages.x86_64-linux.nchnroutes
          wc -l result/etc/bird/nchnroutes4.conf result/etc/bird/nchnroutes6.conf

      - name: Commit updated snapshot
        run: |
          set -euo pipefail
          if git diff --quiet -- flake.lock packages/nchnroutes/default.nix; then
            echo "nchnroutes inputs are already current"
            exit 0
          fi
          git config user.name "nchnroutes updater"
          git config user.email "nchnroutes-updater@beaco.works"
          git add flake.lock packages/nchnroutes/default.nix
          git -c commit.gpgsign=false commit -m "chore(nchnroutes): update routing data"
          git push origin HEAD:main
