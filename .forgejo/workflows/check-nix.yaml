name: Nix Validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  nix-evaluation:
    runs-on: nix-check
    timeout-minutes: 720
    env:
      NIX_CONFIG: |
        eval-cache = false
      NIX_CURL_FLAGS: --ipv4
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate flake outputs
        run: nix flake show --all-systems --no-write-lock-file
      - name: Check talosctl version matches fleet Talos
        run: nix build --no-link .#checks.x86_64-linux.talosctl-version-sync
      - name: Test n8n CI policy
        run: |
          nix shell nixpkgs#nodejs_24 --command node utils/test-n8n-infra-ci.mjs
          nix shell nixpkgs#nodejs_24 --command node utils/test-renovate-merge-queue.mjs
      - name: Check OpenStatus receiver and probe wiring
        run: |
          nix shell nixpkgs#kubectl --command bash utils/check-openstatus-wiring.sh
          scripts=(
            utils/check-openstatus-acceptance.sh
            utils/check-openstatus-backup-conflicts.sh
            utils/check-openstatus-backups.sh
            utils/check-openstatus-mcp-readonly.sh
            utils/check-openstatus-restore-drill.sh
            utils/cleanup-openstatus-restore-drill.sh
            utils/render-openstatus-restore-drill.sh
            utils/capture-openstatus-restore-baseline.sh
            utils/check-openstatus-baseline-backup.sh
            utils/classify-openstatus-tinybird-query.sh
            utils/initialize-openstatus-tinybird.sh
            utils/quiesce-openstatus-writers.sh
            utils/render-openstatus-baseline-backup.sh
            utils/start-openstatus-baseline-backup.sh
            utils/test-openstatus-acceptance-evidence.sh
            utils/test-openstatus-initialization-backup.sh
            utils/test-openstatus-quiesce-window.sh
            utils/test-openstatus-restore-baseline.sh
            utils/test-openstatus-restore-cleanup.sh
            utils/validate-openstatus-acceptance-evidence.sh
            utils/validate-openstatus-restore-baseline.sh
            utils/with-openstatus-quiesced.sh
          )
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          bash utils/test-openstatus-acceptance-evidence.sh
          nix shell nixpkgs#kubectl --command bash utils/test-openstatus-initialization-backup.sh
          nix shell nixpkgs#kubectl --command bash utils/test-openstatus-quiesce-window.sh
          bash utils/test-openstatus-restore-baseline.sh
          nix shell nixpkgs#kubectl --command bash utils/test-openstatus-restore-cleanup.sh
      - name: Build OCI images
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/prod')
        run: |
          set -euo pipefail
          nix build --print-out-paths --out-link result-ci-coding-agent \
            .#coding-agent-oci | tee coding-agent-store-path.txt
          nix build --print-out-paths --out-link result-ci-multica \
            .#multica-backend-oci | tee multica-store-path.txt
          nix build --print-out-paths --out-link result-ci-coder-server \
            .#coder-server-oci | tee coder-server-store-path.txt
          nix build --print-out-paths --out-link result-ci-openstatus-private-probe \
            .#openstatus-private-probe-oci | tee openstatus-private-probe-store-path.txt
      # The public repo only builds/inspects OCI archives. Publishing the
      # production images (and the disposable ci-scratch tags they used to
      # cover) is owned solely by infra-private (BEACO-140/BEACO-219); this
      # workflow holds no registry write credentials.
