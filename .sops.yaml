# sops encryption rules
#
# Beacon uses GPG (YubiKey) for encryption/decryption.
# Clerks use age keys derived from SSH host keys (ssh-to-age).
#
# To add a new clerk machine:
#   1. Enable sshd (services.openssh.enable = true)
#   2. Extract the age public key:
#        ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub
#   3. Add the key below and run: sops updatekeys <secret-files>

keys:
  # ── Personal GPG (YubiKey) ──────────────────────────────────
  - &personal_gpg 65C80FDF47908160E7F30FBE58FCE01334F49CA9

  # ── Machine age keys (derived from SSH host ed25519 keys) ───
  # darwin
  - &mac_mini_m4_age age1ypc5zlh0zemv904jlpltlfqs8g0q6yh03xp4uamtenxpkzx4news3gemxk
  - &mac_studio_m2_ultra_age age198u72xdclycdl00k0yhl7acxuc4wus7sgnwane7mvht34uvsyeeqxn38mu
  # NixOS
  - &flint_age age1yvyak8c38qf8aut8jal5qt7pfqwmx47q08jp4nzzkkf50c607g5sa0g4zl
  - &cygnus_age age1vn5tp6hzv3tweha9hxmugq3pkgtq72376z3ax05x7lu7u3l7y4ws7dwxe3
  - &ark_age age1j43xy7tsw0jj282zlnh0dxl24j45vkl7ss5pdjvxjskr8w80v4vqrpkjp5
  - &shuttle_age age1h997a483ansth5pn99ppgfr5pzru8vepcd438js6vzz64yjguvqq36pcgt
  - &speicher_age age18y8emzqd6ek8vtk9xrlhevmy2k2gzwy3c9sahz4wl0e27svdz5pqahrndv
  - &glacier_age age1gce0gpezreu4e597smygfnfddmd8sy4plz8knqez3yn4sk98n46qc7d0td
  - &octo_age age165eqmku6nz3n7l75t5akghmfhce2y3lcj6g8r4dy5m7kxemfa3cqvs3xgl
  - &courier_age age1pcmty2c368v2ujx30zdaga6az9cx5fhnp8nrmy9qx59qfhszcs9qhkmrwr
  - &msi_claw_age age1tpm1qf4rtzpw8hstpu093mdn3n0w2mtx30fmuykw5zukytgegj9rlztacruqnh5
  - &thinkbook_plus_hybrid_age age1uje8r5e6vfljpmfuknfk92dk20dn3hzfx3sgy9z22l7hy28q9yeq8urukn
  - &surface_pro_8_age age1tpm1q0009mzte44x9a6rer8zf34249r0n6h7up6tz4jpht97nwsjk8x378wj4cl
  - &m920x_age age1p8nue0aaq3ms20dhkz3f5cfcln2jjhshwfhhy4njd9w6suc42eysdwt6wt
  - &hpe_microserver_age age1ydr0lk4m3xgqs8s8s2ynnxfjrhhesgr0agwj9mlz0ds6vqzuhgtsul5jv7
  - &ms_r1_age age15wuj5a3j2ec36u9fmlnftm6sgynk580zk5xt6nrun9lvr2ja698shc5mdl
  # - &surface_book_3_age age1TODO_REPLACE_AFTER_NIXOS_INSTALL_SURFACE_BOOK_3
  # Harvester build nodes — fill in after first boot:
  #   ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub  (per host)
  # then add each to the shared-secret creation_rules below and run
  #   sops updatekeys secrets/shared/{forgejo-runner,attic,comin-forgejo-token,edge-tailscale}.yaml
  # - &nixbuilder_01_age age1TODO_REPLACE_AFTER_NIXOS_INSTALL_NIXBUILDER_01
  # - &nixbuilder_02_age age1TODO_REPLACE_AFTER_NIXOS_INSTALL_NIXBUILDER_02
  # - &nixbuilder_03_age age1TODO_REPLACE_AFTER_NIXOS_INSTALL_NIXBUILDER_03
  # clerks
  - &clerk_technician age16v9vne0t403sxc6c8jm5j4q55qvhsrmnytrghx6lr7aglaf5tesqre80ng
  - &clerk_secretary age1sqr8n02u9f4g4fhp8gcnhvf3emz3t98zhg33efguqn92nr3k9pgs9jfgnv
  # installer ISO — embedded age key (private key stored in secrets/installer/age-key.yaml)
  # Acceptable to embed in ISO since the ISO itself is not published.
  - &installer_age age1zl7ckn4h63fmd25ll6s7anxh5rkdnjpumdfjyz0xhp7sf6mfnv7sqm80je
  # K8s sing-box container — dedicated key (private key in secrets/k8s/sing-box-age-key.yaml)
  # Mounted as K8s secret to /var/lib/sops-nix/age.key in the container
  - &k8s_sing_box_age age1v55hrkzcguwwm7eh437yvv9tpu2d9kj0rw4tuswpundkmxncddmqdynns3
  # Trusted Multica/Coder GitOps runtime
  - &multica_nixos_agent_age age1z3ze2hu0j2pe0t3nyt0u42w5f4wkajg5dp203az03kep0ze9c4fszlar25

creation_rules:
  - path_regex: secrets/server/flint/.*
    key_groups:
      - pgp:
          - *personal_gpg
        age:
          - *flint_age
          - *multica_nixos_agent_age

  - path_regex: secrets/server/cygnus/.*
    key_groups:
      - pgp:
          - *personal_gpg
        age:
          - *cygnus_age
          - *multica_nixos_agent_age

  - path_regex: secrets/server/shuttle/.*
    key_groups:
      - pgp:
          - *personal_gpg
        age:
          - *shuttle_age
          - *multica_nixos_agent_age

  - path_regex: secrets/server/speicher/.*
    key_groups:
      - pgp:
          - *personal_gpg
        age:
          - *speicher_age
          - *multica_nixos_agent_age

  - path_regex: secrets/server/courier/.*
    key_groups:
      - pgp:
          - *personal_gpg
        age:
          - *courier_age
          - *multica_nixos_agent_age

  # Shared secrets — all machines can decrypt (e.g. sing-box nodes)
  - path_regex: secrets/shared/.*
    key_groups:
      - pgp:
          - *personal_gpg
        age:
          - *mac_mini_m4_age
          - *mac_studio_m2_ultra_age
          - *flint_age
          - *cygnus_age
          - *ark_age
          - *shuttle_age
          - *glacier_age
          - *octo_age
          - *courier_age
          - *msi_claw_age
          - *thinkbook_plus_hybrid_age
          - *surface_pro_8_age
          - *m920x_age
          - *hpe_microserver_age
          - *ms_r1_age
        #  - *surface_book_3_age
          - *clerk_technician
          - *clerk_secretary
          - *installer_age
          - *k8s_sing_box_age
          - *multica_nixos_agent_age

  # Personal secrets — only beacon's machines (all personal devices)
  - path_regex: secrets/personal/.*
    key_groups:
      - pgp:
          - *personal_gpg
        age:
          - *mac_mini_m4_age
          - *mac_studio_m2_ultra_age
          - *msi_claw_age
          - *thinkbook_plus_hybrid_age
          - *surface_pro_8_age
          - *m920x_age
          - *hpe_microserver_age
        #  - *surface_book_3_age

  # Installer secrets — age key embedded in ISO at build time
  - path_regex: secrets/installer/.*
    key_groups:
      - pgp:
          - *personal_gpg
        age:
          - *mac_mini_m4_age
          - *mac_studio_m2_ultra_age
          - *installer_age

  # K8s secrets — only beacon's GPG + personal age can decrypt
  # (the k8s age key itself is stored here, so it cannot decrypt its own file)
  - path_regex: secrets/k8s/.*
    key_groups:
      - pgp:
          - *personal_gpg
        age:
          - *mac_mini_m4_age
          - *mac_studio_m2_ultra_age
          - *multica_nixos_agent_age

  # Per-clerk secrets — each clerk can only decrypt its own
  # - path_regex: secrets/clerks/default/.*
  #   key_groups:
  #     - age:
  #         - *clerk_default

  - path_regex: secrets/clerks/technician/.*
    key_groups:
      - age:
          - *clerk_technician

  - path_regex: secrets/clerks/secretary/.*
    key_groups:
      - pgp:
          - *personal_gpg
        age:
          - *clerk_secretary
