  - &wanxiang_flux_age age19w3svwspecedu893ges7te9qc5qgj3r5tykpkqrl43f90ndlvg4qant4ej

creation_rules:
  - path_regex: wanxiang/kubernetes/.*\.sops\.ya?ml
    encrypted_regex: ^(data|stringData)$
    mac_only_encrypted: true
    key_groups:
      - pgp:
          - *personal_gpg
        age:
          - *wanxiang_flux_age

  - path_regex: secrets/server/flint/.*
    key_groups:
      - pgp:
          - *personal_gpg
        age:
          - *flint_age
          - *multica_nixos_agent_age

  - path_regex: secrets/server/cygnus/.*
    key_groups:
      - pgp:
          - *personal_gpg
        age:
          - *cygnus_age
          - *multica_nixos_agent_age

  - path_regex: secrets/server/shuttle/.*
    key_groups:
      - pgp:
          - *personal_gpg
        age:
          - *shuttle_age
          - *multica_nixos_agent_age

  - path_regex: secrets/server/speicher/.*
    key_groups:
      - pgp:
          - *personal_gpg
        age:
          - *speicher_age
          - *multica_nixos_agent_age

  - path_regex: secrets/server/courier/.*
    key_groups:
      - pgp:
          - *personal_gpg
        age:
          - *courier_age
          - *multica_nixos_agent_age

  # Builder runtime secrets — shared fleet recipients plus the build nodes.
  - path_regex: secrets/shared/(attic|comin-forgejo-token|forgejo-runner)\.yaml
    key_groups:
      - pgp:
          - *personal_gpg
        age:
          - *mac_mini_m4_age
          - *mac_studio_m2_ultra_age
          - *flint_age
          - *cygnus_age
          - *ark_age
          - *shuttle_age
          - *glacier_age
          - *octo_age
          - *courier_age
          - *msi_claw_age
          - *thinkbook_plus_hybrid_age
          - *surface_pro_8_age
          - *m920x_age
          - *hpe_microserver_age
          - *ms_r1_age
          - *nixbuilder_01_age
          - *nixbuilder_02_age
          - *nixbuilder_03_age
          - *clerk_technician
          - *clerk_secretary
          - *multica_nixos_agent_age

  # Shared secrets — all machines can decrypt
  - path_regex: secrets/shared/.*
    key_groups:
      - pgp:
          - *personal_gpg
        age:
          - *mac_mini_m4_age
          - *mac_studio_m2_ultra_age
          - *flint_age
          - *cygnus_age
          - *ark_age
          - *shuttle_age
          - *glacier_age
          - *octo_age
          - *courier_age
          - *msi_claw_age
          - *thinkbook_plus_hybrid_age
          - *surface_pro_8_age
          - *m920x_age
          - *hpe_microserver_age
          - *ms_r1_age
        #  - *surface_book_3_age
          - *clerk_technician
          - *clerk_secretary
          - *multica_nixos_agent_age

  # Personal secrets — only beacon's machines (all personal devices)
  - path_regex: secrets/personal/.*
    key_groups:
      - pgp:
          - *personal_gpg
        age:
          - *mac_mini_m4_age
          - *mac_studio_m2_ultra_age
          - *msi_claw_age
          - *thinkbook_plus_hybrid_age
          - *surface_pro_8_age
          - *m920x_age
          - *hpe_microserver_age
        #  - *surface_book_3_age

  # Per-clerk secrets — each clerk can only decrypt its own
  # - path_regex: secrets/clerks/default/.*
  #   key_groups:
  #     - age:
  #         - *clerk_default

  - path_regex: secrets/clerks/technician/.*
    key_groups:
      - age:
          - *clerk_technician

  - path_regex: secrets/clerks/secretary/.*
    key_groups:
      - pgp:
          - *personal_gpg
        age:
          - *clerk_secretary
